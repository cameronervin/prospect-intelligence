name: langchain-takehome-e2e

services:
  postgres:
    ports: !override []

  backend:
    build:
      target: e2e
    env_file: !override []
    environment:
      TAKEHOME_ENVIRONMENT: test
      TAKEHOME_EXTERNAL_LIVE_ENABLED: "false"
      TAKEHOME_ONLINE_QUALITY_ENABLED: "false"
      LANGSMITH_TRACING: "false"
      OPENAI_API_KEY: ""
      LANGSMITH_API_KEY: ""
      TYPESAFE_API_KEY: ""
      TAVILY_API_KEY: ""
      FMCSA_WEB_KEY: ""
    ports: !override []

  frontend:
    ports: !override
      - target: 3000
        host_ip: 127.0.0.1
