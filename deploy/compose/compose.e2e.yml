name: langchain-takehome-e2e

services:
  postgres:
    ports: !override []

  migrate:
    command:
      ["sh", "-c", "alembic upgrade head && python -m scripts.seed_demo_data"]

  backend:
    build:
      target: e2e
    command:
      - uvicorn
      - tests.e2e_app:create_e2e_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    labels:
      com.langchain-takehome.e2e-safe: "true"
      com.langchain-takehome.e2e-source-id: ${TAKEHOME_E2E_SOURCE_ID:-unset}
    env_file: !override []
    environment:
      TAKEHOME_ENVIRONMENT: test
      TAKEHOME_EXTERNAL_LIVE_ENABLED: "false"
      TAKEHOME_ONLINE_QUALITY_ENABLED: "false"
      TAKEHOME_DEMO_AUTH_ENABLED: "true"
      TAKEHOME_RUNTIME_JEV_GUARDRAILS_ENABLED: "false"
      LANGSMITH_TRACING: "false"
      OPENAI_API_KEY: ""
      LANGSMITH_API_KEY: ""
      TYPESAFE_API_KEY: ""
      TAVILY_API_KEY: ""
      FMCSA_WEB_KEY: ""
    ports: !override []

  frontend:
    labels:
      com.langchain-takehome.e2e-safe: "true"
      com.langchain-takehome.e2e-source-id: ${TAKEHOME_E2E_SOURCE_ID:-unset}
    ports: !override
      - target: 3000
        host_ip: 127.0.0.1
