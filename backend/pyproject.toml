[project]
name = "langchain-takehome-backend"
version = "0.1.0"
description = "Domain-neutral FastAPI, LangGraph, and LangSmith application foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "deepagents>=0.3,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-quickjs>=0.2,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langsmith>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<27",
  "system-one-adapter[openai]>=0.2.1,<0.3",
  "typesafe-sdk>=0.7.2,<0.8",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"evaluation/datasets/golden/freight_prospect_v1.json" = "evaluation/datasets/golden/freight_prospect_v1.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "postgresql: requires TAKEHOME_TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["app", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
